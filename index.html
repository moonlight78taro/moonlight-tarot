
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달빛 타로 | Moonlight Tarot</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(
        ellipse at 50% 30%,
        #302450 0%,
        #14132e 45%,
        #080d20 100%
      );
      color: #f5e8d0;
      font-family: Georgia, "Malgun Gothic", serif;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      padding: 70px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stars {
      color: #e6c58c;
      letter-spacing: 18px;
      font-size: 22px;
    }

    .moon {
      font-size: 78px;
      color: #f6dca6;
      margin: 24px 0;
      text-shadow: 0 0 40px #c9a4f5;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      letter-spacing: 5px;
      margin: 12px 0;
    }

    .english {
      color: #c9b1e4;
      font-size: 13px;
      letter-spacing: 5px;
    }

    .description {
      margin: 45px 0;
      line-height: 1.7;
      font-size: 15px;
      color: #ded4e9;
    }

    button {
      background: transparent;
      color: #f3dfb5;
      border: 1px solid #d5b57e;
      border-radius: 30px;
      padding: 17px 48px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #d5b57e;
      color: #15132d;
    }

    footer {
      margin-top: 70px;
      color: #9485ae;
      font-size: 12px;
    }

   


@media (max-width: 480px) {

  .container {
    padding: 20px 20px 35px;
    justify-content: flex-start;
  }

  .stars {
    font-size: 18px;
  }

  .moon {
    font-size: 48px;
    margin: 10px 0;
  }

  .tarot-card {
    width: 135px;
    margin: 8px 0;
  }

  h1 {
    font-size: 30px;
    margin: 8px 0;
  }

  .english {
    font-size: 11px;
    letter-spacing: 4px;
  }

  .description {
    margin: 20px 0;
    line-height: 1.8;
    font-size: 14px;
  }

  button {
    padding: 14px 36px;
    font-size: 15px;
  }

  footer {
    margin-top: 30px;
  }
}



  
.tarot-card {
  width: 170px;
  max-width: 55vw;
  height: auto;
  margin: 15px 0;
  border-radius: 10px;
  box-shadow: 0 0 35px rgba(180, 130, 255, 0.3);
}
.tarot-card {
  cursor: pointer;
  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease;
}

@media (hover: hover) and (pointer: fine) {
  a:hover > .tarot-card {
    transform: scale(1.06);
    box-shadow:
      0 0 20px rgba(255, 220, 150, 0.6),
      0 0 45px rgba(180, 130, 255, 0.65),
      0 0 70px rgba(150, 100, 255, 0.3);
  }
}

@media (prefers-reduced-motion: reduce) {
  .tarot-card {
    transition: none;
  }
}

.card-guide {
  color: #ffe5a8;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  margin: 2px 0 14px;

  text-shadow:
    0 0 6px rgba(255, 225, 150, 0.9),
    0 0 14px rgba(255, 200, 100, 0.6),
    0 0 24px rgba(255, 190, 90, 0.3);

  animation: guideGlow 1.2s ease-in-out infinite alternate;
}

@keyframes guideGlow {
  from {
    opacity: 0.85;
    text-shadow:
      0 0 5px rgba(255, 225, 150, 0.6),
      0 0 12px rgba(255, 200, 100, 0.3);
  }

  to {
    opacity: 1;
    text-shadow:
      0 0 8px rgba(255, 235, 180, 1),
      0 0 20px rgba(255, 210, 120, 0.9),
      0 0 35px rgba(255, 190, 90, 0.55);
  }
}

.footer-link {
  display: inline-block;
  color: #c9b1e4;
  font-size: 13px;
  text-decoration: none;
  padding: 8px 12px;
}

.footer-link:hover {
  color: #f3dfb5;
  text-decoration: underline;
}

.footer-message {
  margin-top: 12px;
}


.footer-divider {
  color: #75678e;
  font-size: 12px;
  margin: 0 2px;
}

  </style>
</head>
